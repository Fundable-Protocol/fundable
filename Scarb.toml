[package]
name = "fundable"
version = "0.1.0"
edition = "2023_11"

# See more keys and their definitions at https://docs.swmansion.com/scarb/docs/reference/manifest.html

[dependencies]
openzeppelin = "1.0.0"
starknet = "2.15.0"

[dev-dependencies]
snforge_std = "0.54.1"
assert_macros = "2.15.0"

[[target.starknet-contract]]
casm = true
sierra = true

[scripts]
test = "SNFORGE_BACKTRACE=1 snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[[tool.snforge.fork]]
name = "MAINNET"
url = "https://api.zan.top/node/v1/starknet/mainnet/8210d74485b74ede9cef63ca49dde31d"
block_id.tag = "latest"

[tool.snforge]
fuzzer_runs = 10